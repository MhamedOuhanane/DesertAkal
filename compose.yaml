services:
  desertakal-postgres:
    image: postgres:16-alpine
    container_name: desertakal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - desertakal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desertakal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  desertakal-minio:
    image: minio/minio
    container_name: desertakal-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - desertakal-network

  backend:
    image: desertakal-backend:1.0.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: desertakal-backend
    restart: unless-stopped
    env_file:
       - .env
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
#      - ./backend:/app
      - maven_cache:/root/.m2
    depends_on:
      desertakal-postgres:
        condition: service_healthy
      desertakal-minio:
        condition: service_started
    networks:
      - desertakal-network

  frontend:
    build: ./frontend
    container_name: desertakal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - desertakal-network


volumes:
  postgres_data:
  maven_cache:
  minio_data:

networks:
  desertakal-network:
    driver: bridge
