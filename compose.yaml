services:
  postgres:
    image: postgres:16-alpine
    container_name: desertakal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: desertakal_db
      POSTGRES_USER: desertakal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - desertakal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desertakal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: desertakal-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/desertakal_db
      SPRING_DATASOURCE_USERNAME: desertakal
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - desertakal-network

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: desertakal-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - desertakal-network

volumes:
  postgres_data:
  maven_cache:
  pgadmin_data:

networks:
  desertakal-network:
    driver: bridge
