<section class="relative overflow-hidden py-28">
    <div
        class="absolute inset-0"
        style="
            background: linear-gradient(
                180deg,
                var(--bg-color) 0%,
                color-mix(in srgb, var(--primary-color) 4%, var(--surface-color)) 30%,
                color-mix(in srgb, var(--primary-color) 4%, var(--surface-color)) 70%,
                var(--bg-color) 100%
            );
        "
    ></div>

    <div
        class="absolute inset-0 opacity-[0.02]"
        style="
            background-image: radial-gradient(
                circle,
                var(--text-primary-color) 1px,
                transparent 1px
            );
            background-size: 32px 32px;
        "
    ></div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mx-auto mb-20 max-w-2xl text-center">
            <div class="flex items-center justify-center gap-3">
                <div class="h-px w-10 bg-primary/40"></div>
                <div
                    class="flex items-center gap-2 rounded-full border border-primary/20 bg-primary/5 px-4 py-1.5"
                >
                    <mat-icon
                        class="text-primary"
                        style="font-size: 12px; width: 12px; height: 12px"
                        >shield</mat-icon
                    >
                    <span class="text-[10px] font-bold uppercase tracking-[0.15em] text-primary"
                        >Why Choose Us</span
                    >
                </div>
                <div class="h-px w-10 bg-primary/40"></div>
            </div>
            <h2 class="mt-6 text-3xl font-black tracking-tight text-text-primary sm:text-4xl">
                Travel Morocco with
                <span class="text-gradient">Confidence</span>
            </h2>
            <p class="mt-4 text-sm leading-relaxed text-text-secondary">
                Everything you need for an unforgettable journey across Morocco's diverse landscapes
                and cultures
            </p>
        </div>

        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
            @for (feat of features; track feat.title; let i = $index) {
                <div
                    class="card group relative overflow-hidden rounded-2xl p-8 transition-all duration-500 hover:border-primary/20 hover:shadow-elevated"
                >
                    <div
                        class="absolute inset-0 bg-linear-to-br from-primary/2 to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"
                    ></div>

                    <div
                        class="absolute -right-6 -top-6 h-20 w-20 rounded-full bg-primary/3 transition-all duration-700 group-hover:h-32 group-hover:w-32 group-hover:bg-primary/6"
                    ></div>

                    <div class="relative">
                        <div
                            class="mb-7 flex h-14 w-14 items-center justify-center rounded-2xl ring-1 ring-transparent transition-all duration-300 group-hover:ring-primary/10"
                            [class]="feat.accent"
                        >
                            <mat-icon style="font-size: 24px; width: 24px; height: 24px">{{
                                feat.icon
                            }}</mat-icon>
                        </div>

                        <span
                            class="absolute right-0 top-0 text-[40px] font-black leading-none text-border/20"
                            >0{{ i + 1 }}</span
                        >

                        <h3 class="text-[15px] font-bold text-text-primary">{{ feat.title }}</h3>
                        <p class="mt-3 text-xs leading-[1.8] text-text-tertiary">
                            {{ feat.desc }}
                        </p>

                        <div
                            class="mt-5 flex items-center gap-1 text-[11px] font-bold text-primary opacity-0 transition-all duration-300 group-hover:opacity-100"
                        >
                            Learn more
                            <mat-icon style="font-size: 12px; width: 12px; height: 12px"
                                >east</mat-icon
                            >
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>
</section>
