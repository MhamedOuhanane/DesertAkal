<div
    class="relative flex min-h-screen items-center justify-center selection:bg-primary selection:text-white"
>
    <div class="fixed inset-0 z-0">
        <img
            src="https://images.unsplash.com/photo-1542401886-65d6c61db217?q=80&w=2070&auto=format&fit=crop"
            alt="Starry desert night"
            class="h-full w-full object-cover"
            loading="eager"
        />
        <div class="absolute inset-0 bg-linear-to-b from-black/25 via-black/50 to-black/85"></div>
    </div>

    <div class="relative z-10 w-full max-w-md px-5 py-10 sm:px-6 md:px-0 md:py-12">
        <div class="mb-4 flex items-center justify-center gap-3">
            <app-brand-logo classLogo="h-30" [isExpanded]="false" />
        </div>

        <div
            class="animate-scale-in overflow-hidden rounded-2xl border border-border/50 bg-surface/95 p-7 shadow-2xl backdrop-blur-xl sm:p-8"
        >
            <div class="mb-7">
                <h2 class="text-[28px] font-bold leading-tight text-text-primary sm:text-3xl">
                    Welcome back
                </h2>
                <p class="mt-2 text-[15px] leading-relaxed text-text-secondary">
                    Sign in to continue your journey across the dunes.
                </p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-1">
                <app-text-input
                    formControlName="username"
                    label="Email Address"
                    placeholder="nomad@desertakal.com"
                    id="login-email"
                    type="email"
                    matIcon="mail"
                    autocomplete="email"
                />

                <app-text-input
                    formControlName="password"
                    label="Password"
                    placeholder="••••••••"
                    id="login-password"
                    matIcon="lock"
                    [isPassword]="true"
                    autocomplete="current-password"
                />

                <div class="flex justify-end pb-4">
                    <a
                        routerLink="/auth/forgot-password"
                        class="text-sm font-semibold text-primary transition-colors duration-200 hover:text-primary-hover"
                    >
                        Forgot password?
                    </a>
                </div>

                <button
                    type="submit"
                    [disabled]="isLoading()"
                    class="btn-primary w-full justify-center py-3.5 text-[15px]"
                    [class.opacity-60]="isLoading()"
                    [class.pointer-events-none]="isLoading()"
                >
                    @if (isLoading()) {
                        <svg class="h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>
                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                            ></path>
                        </svg>
                        <span class="ml-2">Signing in…</span>
                    } @else {
                        <span>Sign In</span>
                    }
                </button>
            </form>

            <div class="my-7 flex items-center gap-4">
                <div class="divider flex-1"></div>
                <span class="text-xs font-semibold uppercase tracking-widest text-text-disabled"
                    >Or</span
                >
                <div class="divider flex-1"></div>
            </div>

            <app-oauth-login />

            <div class="mt-7 text-center space-y-3">
                <p class="text-sm text-text-secondary">
                    Don't have an account?
                    <a
                        routerLink="/auth/register"
                        class="font-bold text-primary transition-colors duration-200 hover:text-primary-hover"
                    >
                        Sign up
                    </a>
                </p>

                <p class="text-sm text-text-secondary">
                    Didn't get the email?
                    <a
                        routerLink="/auth/verify-email"
                        class="font-bold text-primary hover:text-primary-hover transition-colors"
                    >
                        Verify your account
                    </a>
                </p>
            </div>
        </div>

        <div class="mt-8 flex items-center justify-center gap-5 text-[13px] text-white/40">
            <a href="#" class="transition-colors duration-200 hover:text-white/70"
                >Privacy Policy</a
            >
            <span class="text-white/20">•</span>
            <a href="#" class="transition-colors duration-200 hover:text-white/70"
                >Terms of Service</a
            >
        </div>
    </div>

    <div
        class="pointer-events-none fixed bottom-0 left-0 z-0 h-40 w-full bg-linear-to-t from-primary/8 to-transparent"
    ></div>
</div>
