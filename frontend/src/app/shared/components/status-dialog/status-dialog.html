<div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    (click)="cancel.emit()"
>
    <div
        class="w-full max-w-sm rounded-2xl border border-border bg-surface p-6 shadow-xl"
        (click)="$event.stopPropagation()"
    >
        <div class="mb-4 flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-orange-500/10">
                <svg
                    class="h-5 w-5 text-orange-500"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                    />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </div>
            <div>
                <h3 class="text-base font-bold text-text-primary">Update Status</h3>
                <p class="text-xs text-text-tertiary">
                    {{ user().firstName }} {{ user().lastName }}
                </p>
            </div>
        </div>

        <div class="mb-6 space-y-2">
            @for (s of statuses; track s) {
                <button
                    (click)="selectedStatus.set(s)"
                    class="flex w-full items-center gap-3 rounded-lg border p-3 text-left transition-all"
                    [class.border-primary]="selectedStatus() === s"
                    [class.bg-primary/5]="selectedStatus() === s"
                    [class.border-border]="selectedStatus() !== s"
                >
                    <span class="h-2.5 w-2.5 rounded-full" [class]="getStatusConfig(s).dot"></span>
                    <span class="text-sm font-medium" [class]="getStatusConfig(s).text">{{
                        s
                    }}</span>

                    @if (selectedStatus() === s) {
                        <svg
                            class="ml-auto h-4 w-4 text-primary"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="3"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M4.5 12.75l6 6 9-13.5"
                            />
                        </svg>
                    }
                    @if (s === user().status) {
                        <span class="ml-auto text-[10px] text-text-tertiary font-normal"
                            >current</span
                        >
                    }
                </button>
            }
        </div>

        <div class="flex items-center gap-3">
            <button
                (click)="cancel.emit()"
                class="flex-1 rounded-lg border border-border py-2 text-sm font-medium text-text-secondary transition-colors hover:bg-main-bg"
            >
                Cancel
            </button>
            <button
                (click)="confirm.emit(selectedStatus())"
                [disabled]="isUpdating() || selectedStatus() === user().status"
                class="btn-primary flex flex-1 items-center justify-center gap-2 text-sm disabled:opacity-50"
            >
                @if (isUpdating()) {
                    <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24">
                        <circle
                            class="opacity-25"
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="4"
                            fill="none"
                        ></circle>
                        <path
                            class="opacity-75"
                            fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                        ></path>
                    </svg>
                    <span>Updating...</span>
                } @else {
                    <span>Confirm</span>
                }
            </button>
        </div>
    </div>
</div>
