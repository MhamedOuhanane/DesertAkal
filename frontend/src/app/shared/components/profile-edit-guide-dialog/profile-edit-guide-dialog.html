<div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm"
    (click)="cancel.emit()"
>
    <div
        class="w-full max-w-md rounded-2xl border border-border bg-surface shadow-2xl"
        (click)="$event.stopPropagation()"
    >
        <div class="flex items-center gap-3 border-b border-border px-6 py-4">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-500/10">
                <mat-icon class="text-blue-600" style="font-size: 20px; width: 20px; height: 20px"
                    >hiking</mat-icon
                >
            </div>
            <div>
                <h3 class="text-base font-bold text-text-primary">Edit Profile</h3>
                <p class="text-[11px] text-text-tertiary">Guide account — basic info</p>
            </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="px-6 py-5">
            <div class="space-y-1">
                <app-text-input
                    formControlName="firstName"
                    label="First Name"
                    placeholder="John"
                    matIcon="person"
                    id="fn"
                />
                <app-text-input
                    formControlName="lastName"
                    label="Last Name"
                    placeholder="Doe"
                    matIcon="person_outline"
                    id="ln"
                />
                <app-text-input
                    formControlName="phone"
                    label="Phone"
                    placeholder="+212600000000"
                    type="tel"
                    matIcon="phone"
                    id="ph"
                />
            </div>

            <div class="mt-4 rounded-xl bg-main-bg p-4">
                <p class="mb-2 flex items-center gap-1.5 text-xs font-semibold text-text-tertiary">
                    <mat-icon style="font-size: 14px; width: 14px; height: 14px">info</mat-icon>
                    Managed by Admin
                </p>
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] text-text-tertiary">Experience</span>
                        <span class="text-[11px] font-medium text-text-primary"
                            >{{ profile()!.experienceYears }} years</span
                        >
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] text-text-tertiary">Languages</span>
                        <div class="flex gap-1">
                            @for (lang of profile()!.languages; track lang.uuid) {
                                <span
                                    class="rounded bg-primary/10 px-1.5 py-0.5 text-[9px] font-medium text-primary"
                                >
                                    {{ lang.name }}
                                </span>
                            }
                        </div>
                    </div>
                </div>
                <p class="mt-2 text-[10px] text-text-disabled">
                    Contact an administrator to update experience or languages.
                </p>
            </div>
        </form>

        <div class="flex items-center gap-3 border-t border-border px-6 py-4">
            <button
                type="button"
                (click)="cancel.emit()"
                [disabled]="isSubmitting()"
                class="flex flex-1 items-center justify-center rounded-xl border border-border py-2.5 text-sm font-medium text-text-secondary hover:bg-main-bg disabled:opacity-50"
            >
                Cancel
            </button>
            <button
                type="button"
                (click)="onSubmit()"
                [disabled]="isSubmitting() || form.invalid"
                class="btn-primary flex flex-1 items-center justify-center gap-2 py-2.5 text-sm disabled:opacity-50"
            >
                @if (isSubmitting()) {
                    <mat-icon
                        class="animate-spin"
                        style="font-size: 16px; width: 16px; height: 16px"
                        >autorenew</mat-icon
                    >
                } @else {
                    <mat-icon style="font-size: 16px; width: 16px; height: 16px">save</mat-icon>
                }
                Save
            </button>
        </div>
    </div>
</div>
