<header class="sticky top-0 z-50 w-full border-b border-border bg-surface/80 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <a routerLink="/" class="flex items-center gap-2.5">
            <svg
                class="h-9 w-9 text-primary"
                viewBox="0 0 48 48"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M4 36c4-8 8-16 16-16s8 8 12 8 8-4 12-4v12H4V36z"
                    fill="currentColor"
                    opacity="0.2"
                />
                <circle cx="34" cy="14" r="6" fill="currentColor" />
                <path
                    d="M2 40c6-12 10-20 18-20s10 10 14 10 8-6 12-6v16H2z"
                    fill="currentColor"
                    opacity="0.6"
                />
            </svg>
            <span class="text-xl font-bold tracking-tight text-text-primary">
                Desert<span class="text-primary">Akal</span>
            </span>
        </a>

        <nav class="hidden items-center gap-1 md:flex">
            @for (link of navLinks; track link.path) {
                <a
                    [routerLink]="link.path"
                    routerLinkActive="bg-primary/10 text-primary font-semibold"
                    [routerLinkActiveOptions]="{ exact: link.exact }"
                    class="rounded-lg px-4 py-2 text-sm font-medium text-text-secondary transition-all duration-200 hover:bg-primary/5 hover:text-primary"
                >
                    {{ link.label }}
                </a>
            }
        </nav>

        <div class="flex items-center gap-2">
            <button
                (click)="themeService.toggleTheme()"
                class="flex h-10 w-10 items-center justify-center rounded-lg text-text-secondary transition-all duration-200 hover:bg-primary/5 hover:text-primary"
            >
                @if (themeService.isDark()) {
                    <svg
                        class="h-5 w-5"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="5" />
                        <path
                            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                        />
                    </svg>
                } @else {
                    <svg
                        class="h-5 w-5"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                }
            </button>

            <div class="hidden h-6 w-px bg-border sm:block"></div>

            <a
                routerLink="/auth/login"
                class="hidden rounded-lg px-4 py-2 text-sm font-semibold text-text-secondary transition-all duration-200 hover:text-primary sm:block"
            >
                Connexion
            </a>

            <a
                routerLink="/auth/register"
                class="btn-primary rounded-xl px-5 py-2.5 text-sm font-bold shadow-lg shadow-primary/20"
            >
                Réserver
            </a>

            <button
                (click)="toggleMobileMenu()"
                class="flex h-10 w-10 items-center justify-center rounded-lg text-text-secondary md:hidden"
            >
                @if (mobileMenuOpen()) {
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        />
                    </svg>
                } @else {
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 6h16M4 12h16m-7 6h7"
                        />
                    </svg>
                }
            </button>
        </div>
    </div>

    @if (mobileMenuOpen()) {
        <div class="animate-slide-up border-t border-border bg-surface px-4 pb-6 pt-4 md:hidden">
            <nav class="flex flex-col gap-1">
                @for (link of navLinks; track link.path) {
                    <a
                        [routerLink]="link.path"
                        routerLinkActive="bg-primary/10 text-primary font-semibold"
                        (click)="closeMobileMenu()"
                        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-text-secondary transition-all"
                    >
                        <svg
                            class="h-5 w-5 opacity-70"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                [attr.d]="link.icon"
                            />
                        </svg>
                        {{ link.label }}
                    </a>
                }
                <div class="my-3 h-px bg-border"></div>
                <a
                    routerLink="/auth/login"
                    (click)="closeMobileMenu()"
                    class="rounded-lg px-4 py-3 text-sm font-medium text-text-secondary"
                >
                    Connexion
                </a>
            </nav>
        </div>
    }
</header>
