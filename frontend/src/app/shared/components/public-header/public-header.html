<header
    class="fixed left-0 top-0 z-50 w-full border-b border-border bg-surface/80 backdrop-blur-md"
>
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <app-brand-logo [isExpanded]="isWeb()" />

        <nav class="hidden items-center gap-1 md:flex">
            @for (link of navLinks; track link.path) {
                <a
                    [routerLink]="link.path"
                    routerLinkActive="bg-primary/10 text-primary font-semibold"
                    [routerLinkActiveOptions]="{ exact: link.exact || false }"
                    class="rounded-lg px-1.5 lg:px-4 py-2 text-sm font-medium text-text-secondary transition-all duration-200 hover:bg-primary/5 hover:text-primary"
                >
                    {{ link.label }}
                </a>
            }
        </nav>

        <div class="flex items-center gap-2">
            <app-theme-toggle />

            <div *appIsAuthenticated="false" class="items-center gap-2 hidden md:flex">
                <div class="hidden h-6 w-px bg-border sm:block"></div>

                <a
                    routerLink="/auth/login"
                    class="hidden rounded-lg px-4 py-2 text-sm font-semibold text-text-secondary transition-all duration-200 hover:text-primary sm:block"
                >
                    Sign In
                </a>

                <a
                    routerLink="/auth/register"
                    class="btn-primary rounded-xl px-5 py-2.5 text-sm font-bold shadow-lg shadow-primary/20"
                >
                    Sign Up
                </a>
            </div>

            <div *appIsAuthenticated="true" class="items-center gap-2 hidden md:flex">
                <div class="hidden h-6 w-px bg-border sm:block"></div>
                <app-user-dropdown [userMenuLinks]="userMenuLinks()" />
            </div>

            <button
                (click)="toggleMobileMenu()"
                class="flex h-10 w-10 items-center justify-center rounded-lg text-text-secondary md:hidden"
            >
                @if (mobileMenuOpen()) {
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        />
                    </svg>
                } @else {
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 6h16M4 12h16m-7 6h7"
                        />
                    </svg>
                }
            </button>
        </div>
    </div>

    @if (mobileMenuOpen()) {
        <div
            class="fixed inset-0 z-[-1] h-screen w-screen bg-black/60 backdrop-blur-sm md:hidden"
            (click)="closeMobileMenu()"
        ></div>
        <app-mobile-menu [links]="navLinks" (close)="closeMobileMenu()" />
    }
</header>
