@if (pagination().totalPages > 1) {
    <div class="flex items-center justify-between border-t border-divider px-4 py-3">
        <p class="text-xs text-text-tertiary">
            Page {{ pagination().page + 1 }} of {{ pagination().totalPages }}
            ({{ pagination().totalElements }} total)
        </p>

        <div class="flex items-center gap-1">
            <button
                (click)="goToPage(pagination().page - 1)"
                [disabled]="pagination().isFirst"
                class="flex h-8 w-8 items-center justify-center rounded-lg border border-border text-xs transition-colors hover:bg-primary/5 disabled:opacity-40 disabled:cursor-not-allowed"
            >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
            </button>

            @for (p of pageNumbers; track p) {
                <button
                    (click)="goToPage(p)"
                    class="flex h-8 w-8 items-center justify-center rounded-lg text-xs font-semibold transition-colors"
                    [class]="p === pagination().page ? 'bg-primary text-white' : 'border border-border hover:bg-primary/5 text-text-secondary'"
                >
                    {{ p + 1 }}
                </button>
            }

            <button
                (click)="goToPage(pagination().page + 1)"
                [disabled]="pagination().isLast"
                class="flex h-8 w-8 items-center justify-center rounded-lg border border-border text-xs transition-colors hover:bg-primary/5 disabled:opacity-40 disabled:cursor-not-allowed"
            >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
            </button>
        </div>
    </div>
}
