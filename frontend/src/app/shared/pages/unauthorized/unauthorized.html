<div class="flex flex-col items-center justify-center min-h-[90vh] bg-main-bg p-6 animate-fade-in">
    <div class="bg-surface/60 backdrop-blur-2xl border border-error/20 rounded-3xl p-10 max-w-lg w-full text-center shadow-base relative">
        
        <div class="mb-8 flex justify-center">
            <div class="w-20 h-20 rounded-full bg-error-bg flex items-center justify-center border border-error/20 relative">
                <div class="absolute -inset-2 rounded-full border border-error/20 animate-ping opacity-20"></div>
                <mat-icon class="text-error w-10! h-10! text-[2.5rem]! leading-none">lock</mat-icon>
            </div>
        </div>

        <h1 class="text-7xl font-bold leading-none mb-4 text-text-primary tracking-[0.2em] ml-3">
            403
        </h1>
        <h2 class="text-xl font-bold text-error uppercase tracking-widest mb-6">
            Access Denied
        </h2>

        <p class="text-text-secondary mb-10 leading-relaxed text-lg">
            Sorry, your current privileges do not allow you to access this secure resource.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a routerLink="/" class="btn-secondary hover-lift inline-flex items-center justify-center gap-2">
                <mat-icon class="w-5! h-5! text-[1.25rem]! leading-none">arrow_back</mat-icon>
                Home
            </a>

            <a routerLink="/login" class="btn-primary hover-lift inline-flex items-center justify-center gap-2">
                <mat-icon class="w-5! h-5! text-[1.25rem]! leading-none">login</mat-icon>
                Sign In
            </a>
        </div>
    </div>
</div>
