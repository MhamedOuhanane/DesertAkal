<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400"><svg xmlns="http://www.w3.org/2000/svg" viewBox="72.5 0 300 220" width="400" height="400">
  <defs>
    <!-- Elegant gradients -->
    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1"></stop>
    </linearGradient>
    
    <linearGradient id="goldenSand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"></stop>
    </linearGradient>
    
    <linearGradient id="emeraldGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1"></stop>
    </linearGradient>
    
    <!-- Subtle shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"></feDropShadow>
    </filter>
  </defs>
  
  <!-- Background decorative circle -->
  <circle cx="225" cy="110" r="100" fill="none" stroke="url(#goldenSand)" stroke-width="1" opacity="0.2"></circle>
  
  <!-- Main Title "DESERT" with elegant typography -->
  <text x="225" y="75" font-family="Georgia, Times, serif" font-size="52" font-weight="bold" text-anchor="middle" fill="url(#royalBlue)" letter-spacing="6px" filter="url(#softShadow)">
    DESERT
  </text>
  
  <!-- Refined Amazigh Symbol -->
  <g transform="translate(225, 115)" filter="url(#softShadow)">
    <!-- Outer decorative ring -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#emeraldGreen)" stroke-width="2" opacity="0.6"></circle>
    
    <!-- Main symbol circle -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#emeraldGreen)" stroke-width="3"></circle>
    
    <!-- Four directional arms with elegant ends -->
    <g stroke="url(#emeraldGreen)" stroke-width="3" stroke-linecap="round">
      <!-- Top -->
      <line x1="0" y1="-32" x2="0" y2="-21"></line>
      <circle cx="0" cy="-35" r="2" fill="url(#emeraldGreen)"></circle>
      
      <!-- Right -->
      <line x1="32" y1="0" x2="21" y2="0"></line>
      <circle cx="35" cy="0" r="2" fill="url(#emeraldGreen)"></circle>
      
      <!-- Bottom -->
      <line x1="0" y1="32" x2="0" y2="21"></line>
      <circle cx="0" cy="35" r="2" fill="url(#emeraldGreen)"></circle>
      
      <!-- Left -->
      <line x1="-32" y1="0" x2="-21" y2="0"></line>
      <circle cx="-35" cy="0" r="2" fill="url(#emeraldGreen)"></circle>
    </g>
    
    <!-- Inner decorative elements -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="url(#goldenSand)" stroke-width="2" opacity="0.8"></circle>
    <circle cx="0" cy="0" r="4" fill="url(#goldenSand)"></circle>
    
    <!-- Four small decorative dots -->
    <circle cx="12" cy="0" r="1.5" fill="url(#goldenSand)" opacity="0.7"></circle>
    <circle cx="-12" cy="0" r="1.5" fill="url(#goldenSand)" opacity="0.7"></circle>
    <circle cx="0" cy="12" r="1.5" fill="url(#goldenSand)" opacity="0.7"></circle>
    <circle cx="0" cy="-12" r="1.5" fill="url(#goldenSand)" opacity="0.7"></circle>
  </g>
  
  <!-- Amazigh text "ⴰⴽⴰⵍ" with elegant styling -->
  <text x="225" y="175" font-family="Arial, sans-serif" font-size="36" font-weight="600" text-anchor="middle" fill="url(#goldenSand)" letter-spacing="3px" filter="url(#softShadow)">
    ⴰⴽⴰⵍ
  </text>
  
  <!-- Subtitle in Arabic -->
  <text x="225" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="url(#royalBlue)" opacity="0.8">
    أرض الصحراء
  </text>
  
  <!-- Elegant decorative border -->
  <g opacity="0.6">
    <!-- Central decorative line -->
    <path d="M100 205 Q225 200 350 205" fill="none" stroke="url(#goldenSand)" stroke-width="2"></path>
    
    <!-- Decorative elements along the line -->
    <circle cx="130" cy="204" r="2" fill="url(#goldenSand)"></circle>
    <circle cx="180" cy="202" r="1.5" fill="url(#emeraldGreen)"></circle>
    <circle cx="225" cy="201" r="3" fill="url(#royalBlue)" opacity="0.8"></circle>
    <circle cx="270" cy="202" r="1.5" fill="url(#emeraldGreen)"></circle>
    <circle cx="320" cy="204" r="2" fill="url(#goldenSand)"></circle>
  </g>
</svg></svg><style>@media (prefers-color-scheme: light) { :root { filter: none; } }
@media (prefers-color-scheme: dark) { :root { filter: none; } }
</style></svg>