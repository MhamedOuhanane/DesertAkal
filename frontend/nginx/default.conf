server {
    listen 80;
    server_name desertakal.app www.desertakal.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name desertakal.app www.desertakal.app;

    ssl_certificate /etc/letsencrypt/live/desertakal.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desertakal.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://desertakal-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /desertakal-bucket/ {
        proxy_pass http://desertakal-minio:9000/desertakal-bucket/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /index.html;
}